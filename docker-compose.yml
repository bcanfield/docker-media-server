services:
  # https://docs.linuxserver.io/images/docker-sonarr
  sonarr:
    container_name: sonarr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/sonarr/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: 1g
    stop_grace_period: 30s
    image: linuxserver/sonarr:4.0.19@sha256:c19aa4ecdf03d73e1d5c901da33744cb7eb4d921f89bafed1ca264601d7fa224
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8989:8989
    networks:
      - sofa-squad
    volumes:
      - /etc/localtime:/etc/localtime
      - ${CONFIG_ROOT}/config/sonarr:/config
      - ${MEDIA_ROOT}/complete/tv:/tv
      - ${MEDIA_ROOT}/downloads:/downloads
  # https://docs.linuxserver.io/images/docker-radarr
  radarr:
    container_name: radarr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/radarr/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: 1g
    stop_grace_period: 30s
    image: linuxserver/radarr:6.3.0@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 7878:7878
    networks:
      - sofa-squad
    volumes:
      - /etc/localtime:/etc/localtime
      - ${CONFIG_ROOT}/config/radarr:/config
      - ${MEDIA_ROOT}/complete/movies:/movies
      - ${MEDIA_ROOT}/downloads:/downloads
  # https://github.com/seerr-team/seerr
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: 1g
    stop_grace_period: 30s
    container_name: seerr
    init: true
    environment:
      - TZ=${TZ}
    networks:
      - sofa-squad
    volumes:
      - ${CONFIG_ROOT}/config/jellyseerr:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
  # https://docs.linuxserver.io/images/docker-bazarr
  bazarr:
    container_name: bazarr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: 1g
    stop_grace_period: 30s
    image: linuxserver/bazarr:1.6.0@sha256:ac284d3fda9ee7da8b15197dc51f0d7a2a1da98549bee99a3d924d3e94a5e7ed
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK_SET=022 #optional
    ports:
      - 6767:6767
    networks:
      - sofa-squad
    volumes:
      - ${CONFIG_ROOT}/config/bazarr:/config
      - ${MEDIA_ROOT}/complete/movies:/movies
      - ${MEDIA_ROOT}/complete/tv:/tv
  # https://docs.linuxserver.io/images/docker-sabnzbd/
  sabnzbd:
    image: linuxserver/sabnzbd:5.1.2@sha256:d22bc8b3185f0e0c1050f6427df6b9ad072f70586b3b1edf916131b0c3101542
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8080/sabnzbd/api?mode=version' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: 5g
    stop_grace_period: 60s
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/config/sabnzbd:/config
      - ${MEDIA_ROOT}/downloads:/downloads #optional
      - ${SABNZBD_TEMP:-/tmp/sabnzbd-temp}:/downloads/intermediate
    ports:
      - 8080:8080
    restart: unless-stopped
    networks:
      - sofa-squad
  # https://recyclarr.dev/guide/installation/docker/
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8@sha256:73303ba5ee647b6492fee917d3a781c6e59b6cab08f9dfce9482a950846f564f
    mem_limit: 512m
    stop_grace_period: 30s
    container_name: recyclarr
    user: ${PUID}:${PGID}
    restart: unless-stopped
    networks:
      - sofa-squad
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=@daily
    volumes:
      - ${CONFIG_ROOT}/config/recyclarr:/config
  # https://docs.linuxserver.io/images/docker-prowlarr
  prowlarr:
    container_name: prowlarr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: 768m
    stop_grace_period: 30s
    image: linuxserver/prowlarr:2.6.2-nightly@sha256:ff4007dc43988ce71b94d1547dd192cd98e35d93f2d69266a782642ae97d783e
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 9696:9696
    networks:
      - sofa-squad
    volumes:
      - ${CONFIG_ROOT}/config/prowlarr:/config
  # https://github.com/louislam/uptime-kuma
  #
  # Watches the things in this setup that fail *silently*: Jellyfin (which runs
  # outside this stack), the public tunnel hostname, and certificate/key expiry.
  # A tunnel reports Healthy while its origin 502s, and a stopped media server
  # looks identical to an idle one until someone tries to watch something.
  #
  # Blind spot worth knowing: it cannot monitor its own host. Running inside
  # this stack means it stops when the stack stops, so it will never tell you
  # the stack went down -- that check has to originate somewhere else. See
  # docs/uptime-kuma.md.
  uptime-kuma:
    container_name: uptime-kuma
    # The image ships its own HEALTHCHECK (extra/healthcheck, 180s start
    # period); no need to restate a worse one here.
    mem_limit: 512m
    stop_grace_period: 30s
    image: louislam/uptime-kuma:2.5.3@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    ports:
      - 3001:3001
    networks:
      - sofa-squad
    volumes:
      - ${CONFIG_ROOT}/config/uptime-kuma:/app/data
  # https://tailscale.com/kb/1282/docker
  tailscale:
    container_name: tailscale
    mem_limit: 256m
    stop_grace_period: 30s
    image: tailscale/tailscale:v1.102.3
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-media-server}
    network_mode: host
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-exit-node
    volumes:
      - ${CONFIG_ROOT}/config/tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
  # https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
  #
  # Outbound-only tunnel to Cloudflare's edge — no inbound port forwarding, no
  # firewall holes. Ingress rules (which hostname maps to which service) are
  # NOT here: this is a remotely-managed tunnel, so they live in the Zero Trust
  # dashboard and are delivered with the token. See docs/cloudflared.md.
  #
  # Services in this stack are reachable by container name (http://seerr:5055)
  # because cloudflared shares the sofa-squad network with them. A service
  # running outside Docker needs its host's LAN IP instead — in particular, if
  # you run Docker Engine inside WSL and the service is on Windows, do NOT use
  # host.docker.internal: it resolves to the WSL distro's own bridge, which is
  # Linux, not Windows. See docs/cloudflared.md.
  cloudflared:
    container_name: cloudflared
    mem_limit: 256m
    stop_grace_period: 30s
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    # Opt-in. An empty TUNNEL_TOKEN does not make cloudflared sit idle — it
    # exits immediately and `restart: unless-stopped` turns that into a crash
    # loop, which would break `docker compose up -d` for anyone cloning this
    # repo without a Cloudflare account. The profile keeps it out of the
    # default set; enable it by putting COMPOSE_PROFILES=cloudflare in .env,
    # which keeps the plain `docker compose up -d` workflow intact.
    profiles:
      - cloudflare
    # --no-autoupdate: the image is pinned by digest, so let Renovate bump it
    # rather than having the binary silently replace itself inside the container.
    command: tunnel --no-autoupdate run
    environment:
      - TZ=${TZ}
      # `:-` default so Compose does not warn about an unset variable on every
      # command for users who never enable the profile.
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}
    networks:
      - sofa-squad
networks:
  sofa-squad:
    name: sofa-squad
